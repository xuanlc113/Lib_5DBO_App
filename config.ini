[DEFAULT]
host = 127.0.0.1
port = 7496 // tws/ib gateway port
client_id = 10
max_capital = 100000.0 // maximum capital usage, overrides fallback capital
fallback_capital = 100000.0 // capital to use if failed to retrieve from ibkr during startup
risk = 0.01 // account risk per trade, 0.01 = 1% (this is the default risk, depending on trade type, risk will also be adjusted)
bet_multiplier = 1.0 // any additional risk, e.g 1.5 * 1% = risk 1.5%
limit_buffer = 0.02 //limit order points over bid/ask for entry
half_day = false
url = <your discord url for eod channel>

